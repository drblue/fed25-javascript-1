<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="https://fav.farm/📋" />
	<title>29-better-todos</title>

	<!-- Bootstrap 5.3 -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

	<!-- Styles -->
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<div class="container py-2">
		<h1>29-better-todos</h1>

		<h2>Things I've got to do</h2>
		<ul id="todolist" class="todos list-group mb-5"></ul>

		<h2>Things I've done</h2>
		<ul id="completed-todolist" class="todos list-group mb-5"></ul>

		<hr>

		<h2 class="mb-3">Create a new todo</h2>
		<form id="formCreateTodo">
			<div class="mb-3">
				<label for="inputNewTodoTitle" class="form-label">Title</label>
				<input type="text" class="form-control" id="inputNewTodoTitle" placeholder="Buy milk">
			</div>
			<button type="submit" class="btn btn-success">Create</button>
			<button type="reset" class="btn btn-warning">Reset</button>
		</form>
	</div>

	<!-- Script -->
	<script src="script.js"></script>
</body>
</html>
