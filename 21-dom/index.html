<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="https://fav.farm/🛜" />
	<title>21-dom</title>

	<!-- Bootstrap 5.3 -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

	<!-- Styles -->
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<div class="container">
		<h1>21-dom</h1>

		<h2 id="greetings">Hello, there!</h2>

		<hr>

		<ul>
			<li>
				<a href="https://www.google.com" id="link-1">Have you tried Googling it?</a>
			</li>
			<li>
				<a href="https://www.altavista.com">Go old-school</a>
			</li>
		</ul>

		<hr>

		<div class="content">
			<p>Hello, I am paragraph</p>
			<p class="error">Hello, I am an <strong>erronous</strong> paragraph</p>
			<ul>
				<li>list item 1</li>
				<li>list item 2</li>
			</ul>
		</div>

		<div class="alert alert-danger error">
			<!-- Such &lt;strong&gt;error&lt;/strong&gt;.... -->
			Hello, I am an <span class="secret">VERY SECRET</span> error that divides people
		</div>

		<p>I am also a paragraph</p>

		<hr>

		<button class="btn btn-danger">Click me for a nice popup!</button>

		<hr>

		<input type="text" id="inputName" value="Anonymouse">
		<button class="btn btn-primary" id="btnSayHi">Say hi</button>

		<hr>

		<img src="https://i.redd.it/19fq7c002w021.png" class="img-fluid py-5" alt="A very true joke about JavaScript Developers">

	</div>

	<!-- Script -->
	<script src="script.js"></script>
</body>
</html>
