<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="https://fav.farm/🌤️" />
	<title>37-weather-app</title>

	<!-- Bootstrap 5.3 -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

	<!-- Styles -->
	<link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
	<div id="app" class="container">
		<div class="row">
			<div class="col-md-10 offset-md-1 col-lg-8 offset-lg-2">

				<div id="search-wrapper">
					<form id="search-form">
						<div class="input-group">
							<input type="text" id="query" class="form-control" placeholder="Enter city to search for" aria-label="City" aria-details="Search for city to show current weather for." minlength="3" required>
							<button type="submit" class="btn btn-success">🔍</button>
						</div>
					</form>
				</div>

				<div id="spinner" class="hide" role="status">
					<span class="visually-hidden">Loading...</span>
					<img src="assets/images/loading.gif" class="img-fluid">
				</div>

				<div id="alert" class="hide" role="alert"></div>

				<div id="forecast" class="card bg-white text-black hide">
					<img src="assets/images/forecast-banner.png" class="card-img-top">
					<div class="card-body">
						<h5 class="card-title" id="location">
							<span id="city">City</span>,
							<span id="country">Country</span>
						</h5>
						<p class="temp">
							<span id="temperature">42.0</span>
							&deg;C
						</p>
						<p class="humidity">
							<span id="humidity">100</span>
							&percnt; humidity
						</p>
						<p class="wind">
							<span id="windspeed">13.37</span>
							m/s
						</p>
					</div>
				</div>

			</div>
		</div>
	</div>

	<!-- Script -->
	<script src="assets/scripts/owmapi.js"></script>
	<script src="assets/scripts/app.js"></script>
</body>
</html>
